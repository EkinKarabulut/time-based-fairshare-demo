# Helm values for the OpenTelemetry Collector gateway (deployment mode).
# Receives OTLP traces/metrics/logs from workloads and federates the KAI
# metrics already scraped by kube-prometheus-stack, exporting everything
# to Dash0. Endpoint and credentials come from the `dash0-secrets` Secret
# created by scripts/setup-observability.sh.

mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

extraEnvs:
  - name: DASH0_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-authorization-token
  - name: DASH0_ENDPOINT_OTLP_GRPC_HOSTNAME
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-grpc-hostname
  - name: DASH0_ENDPOINT_OTLP_GRPC_PORT
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-grpc-port
  - name: DASH0_DATASET
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-dataset

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # Federate the metrics Prometheus already scrapes via the ServiceMonitors,
    # so the collector doesn't need duplicate scrape configs.
    prometheus:
      config:
        scrape_configs:
          - job_name: prometheus-federate
            scrape_interval: 30s
            honor_labels: true
            metrics_path: /federate
            params:
              'match[]':
                - '{__name__=~"kai_.*"}'
                - '{__name__=~"kube_node_status_capacity"}'
                - '{__name__=~"DCGM_.*"}'
            static_configs:
              - targets:
                  - kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

  processors:
    batch:
      timeout: 10s
      send_batch_size: 1024

  exporters:
    otlp/dash0:
      endpoint: ${DASH0_ENDPOINT_OTLP_GRPC_HOSTNAME}:${DASH0_ENDPOINT_OTLP_GRPC_PORT}
      headers:
        Authorization: Bearer ${DASH0_AUTH_TOKEN}
        Dash0-Dataset: ${DASH0_DATASET}
      tls:
        insecure: false

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/dash0]

      metrics:
        receivers: [otlp, prometheus]
        processors: [batch]
        exporters: [otlp/dash0]

      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/dash0]
