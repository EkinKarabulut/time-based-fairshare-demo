kind: PersesDashboard
spec:
  display:
    name: Time-Based Fairshare Demo
    description: "KubeCon Demo: Time-Based Fairshare GPU Allocation Oscillation — 100 GPU cluster, LLM Team 30 GPU quota, Vision Team 20 GPU quota, 50 GPU shared pool"
  panels:
    header:
      kind: Panel
      spec:
        plugin:
          kind: Markdown
          spec:
            text: |
              ## Time-Based Fairshare Demo &nbsp;&nbsp; 100 GPU Cluster
              **LLM Team:** 30 GPU quota &nbsp;|&nbsp; **Vision Team:** 20 GPU quota &nbsp;|&nbsp; **Shared Pool:** 50 GPUs
        queries: []
        display:
          name: ""
          description: ""
        links: []
    llmGauge:
      kind: Panel
      spec:
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
            thresholds:
              defaultColor: var(--decorative-5-bg)
              steps: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: kai_queue_allocated_gpus{queue_name="llm-team"}
                  legendFormat: LLM Team
        display:
          name: LLM Team GPUs
          description: ""
        links: []
    visionGauge:
      kind: Panel
      spec:
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
            thresholds:
              defaultColor: var(--decorative-11-bg)
              steps: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: kai_queue_allocated_gpus{queue_name="vision-team"}
                  legendFormat: Vision Team
        display:
          name: Vision Team GPUs
          description: ""
        links: []
    allocationOverTime:
      kind: Panel
      spec:
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            yAxis:
              label: GPUs
              min: 0
              max: 100
            visual:
              lineWidth: 2
              areaOpacity: 0.2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: kai_queue_allocated_gpus{queue_name="llm-team"}
                  legendFormat: LLM Team
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: kai_queue_allocated_gpus{queue_name="vision-team"}
                  legendFormat: Vision Team
        display:
          name: GPU Allocation Over Time
          description: ""
        links: []
    pendingDemand:
      kind: Panel
      spec:
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            yAxis:
              label: GPUs
              min: 0
              max: 100
            visual:
              lineWidth: 2
              areaOpacity: 0.4
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_pod_container_resource_limits{namespace="workloads", resource="nvidia_com_gpu", pod=~"llm-.*"} * on(pod, namespace) group_left() kube_pod_status_phase{namespace="workloads", phase="Pending"}) or vector(0)
                  legendFormat: LLM Team (pending)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_pod_container_resource_limits{namespace="workloads", resource="nvidia_com_gpu", pod=~"vision-.*"} * on(pod, namespace) group_left() kube_pod_status_phase{namespace="workloads", phase="Pending"}) or vector(0)
                  legendFormat: Vision Team (pending)
        display:
          name: Pending GPU Demand
          description: ""
        links: []
    fairShareOverTime:
      kind: Panel
      spec:
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            yAxis:
              label: Fair Share (GPUs)
              min: 0
              max: 100
            visual:
              lineWidth: 2
              areaOpacity: 0.1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max(kai_queue_fair_share_gpu{queue_name="LLM Team"})
                  legendFormat: LLM Team
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max(kai_queue_fair_share_gpu{queue_name="Vision Team"})
                  legendFormat: Vision Team
        display:
          name: Fair Share Over Time
          description: ""
        links: []
  layouts:
    - kind: Grid
      spec:
        display:
          title: Imported panels
          collapse:
            open: true
        items:
          - x: 0
            "y": 0
            width: 24
            height: 3
            content:
              $ref: "#/spec/panels/header"
          - x: 0
            "y": 3
            width: 6
            height: 7
            content:
              $ref: "#/spec/panels/llmGauge"
          - x: 6
            "y": 3
            width: 6
            height: 7
            content:
              $ref: "#/spec/panels/visionGauge"
          - x: 12
            "y": 3
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/allocationOverTime"
          - x: 0
            "y": 10
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/pendingDemand"
          - x: 12
            "y": 10
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/fairShareOverTime"
  variables: []
metadata:
  name: time-based-fairshare-demo
